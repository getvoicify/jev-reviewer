name: Jev PR Review
description: >-
  Automated PR review with Jev, TypeSafe's System One model.
  Advisory by default; opt into blocking with fail-on.
author: voicify

inputs:
  mode:
    description: >-
      review posts an advisory review; gate scores the PR's cumulative
      change and fails the job unless it passes. See the README for
      the permissions and workflow gate mode needs.
    required: false
    default: review
  typesafe-api-key:
    description: >-
      TypeSafe API key. Falls back to the TYPESAFE_API_KEY
      environment variable.
    required: false
  github-token:
    description: >-
      GitHub token with pull-requests:write and checks:write
      permissions.
    required: true
    default: ${{ github.token }}
  model:
    description: TypeSafe model alias.
    required: false
    default: jev-latest
  comment:
    description: Post a PR comment with the review.
    required: false
    default: "true"
  fail-on:
    description: >-
      Minimum finding severity that fails the workflow.
      none, low, moderate, high, or critical.
    required: false
    default: "none"
  min-confidence:
    description: Minimum certainty (0-1) for a finding to be reported.
    required: false
    default: "0.6"
  max-files:
    description: Maximum number of files reviewed, in filename order.
    required: false
    default: "40"
  max-chunk-chars:
    description: Maximum characters per review chunk.
    required: false
    default: "8000"
  ignore-paths:
    description: >-
      Newline-separated globs to skip. Replaces the built-in
      defaults (lockfiles, dist/, build/, coverage/, generated/).
    required: false
  questions-file:
    description: >-
      Repo path to a JSON or YAML question-override file, read from
      the PR BASE branch (a PR cannot weaken its own review).
      questions.<id> replaces a built-in, false removes it, new ids
      add custom questions whose answers appear in the comment;
      replace: true starts from an empty set. Empty = built-ins.
    required: false
  gate-config-path:
    description: Gate mode. Repo path of the gate config, read from the PR base branch.
    required: false
    default: .github/jev-gate.json
  trusted-workflow-path:
    description: >-
      Gate mode, required. The workflow path (as workflow runs report
      it) whose stored records the gate trusts.
    required: false
  trusted-workflow-event:
    description: >-
      Gate mode. The event the gate runs on and trusts records from:
      pull_request_target or pull_request.
    required: false
    default: pull_request_target
  override-label:
    description: >-
      Gate mode. The label that accepts a neutral result when an
      override actor applied it after the latest push.
    required: false
    default: jev-gate:override
  override-actors:
    description: >-
      Gate mode. Newline- or comma-separated logins allowed to apply
      the override label. Empty means nobody can override.
    required: false
    default: ""
  check-name:
    description: Gate mode. Name of the check run the gate posts.
    required: false
    default: jev-gate
  comment-author:
    description: Gate mode. Login whose gate comment is edited in place.
    required: false
    default: github-actions[bot]

outputs:
  findings-json:
    description: >-
      Structured review result (chunks, PR-level findings, verdict)
      as JSON.
  verdict:
    description: approve | comment | request_changes
  highest-severity:
    description: none | trivial | low | moderate | high | critical

runs:
  using: node24
  main: dist/index.js
