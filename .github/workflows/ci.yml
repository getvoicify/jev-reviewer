name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Verify the bundle boots on Node 20
        run: |
          set -o pipefail
          node dist/index.js 2>&1 | grep -q "TYPESAFE_API_KEY" \
            && echo "bundle boots and fails gracefully without a key"
