# Jev metric gate, enforcing: required on tutela by an org ruleset workflows rule.
# Rollout and rationale: docs/rollout-required-gate.md; shape pinned by tests/required-workflow.test.ts.
name: Jev gate (required)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: jev-gate-required-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  required-gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: getvoicify/jev-reviewer@a2a6ce8d261d4ffc7999bd24db498976d7da0849
        with:
          mode: gate
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          trusted-workflow-path: .github/workflows/jev-gate-required.yml
          trusted-workflow-required: "true"
          check-name: jev-gate-required
