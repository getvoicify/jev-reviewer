# Jev metric gate, enforcing. An org ruleset "workflows" rule requires this
# file, pinned by SHA, on the repositories it targets; it runs in the target
# repository's context with that repository's secrets. Rollout steps:
# docs/rollout-required-gate.md. Shape and pins are test-locked in
# tests/required-workflow.test.ts.
#
# A ruleset runs this only on the default pull_request_target activity types
# and ignores any filter here, so labeled events never start it.
#
# trusted-workflow-path is a placeholder that matches no run, so no stored
# record is trusted until the canary run reports the real path (runbook step 3).
name: Jev gate (required)
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: jev-gate-required-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  jev-gate-required:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: getvoicify/jev-reviewer@ed390f481d8c724a40e4469936c3ba9fb097974a
        with:
          mode: gate
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          trusted-workflow-path: unverified-until-the-canary-run
          override-actors: verygreenboi
